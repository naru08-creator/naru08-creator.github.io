<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8454430423900366"
     crossorigin="anonymous"></script>
  <title>ぽこあポケモンデータ図鑑｜データ検索・ポケモン一覧ツール</title>

  <meta
    name="description"
    content="ぽこあポケモン図鑑ツール。ポケモンをさまざまな条件から探せる非公式のデータ検索ツールです。"
  >

  <style>
    /* =========================
       基本設定
    ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family:
        "Hiragino Maru Gothic ProN",
        "Yu Gothic",
        "Meiryo",
        sans-serif;

      color: #555;
      background: #8cdef5;
    }

    a {
      text-decoration: none;
      color: inherit;
    }


    /* =========================
       メインエリア
    ========================= */

    .top {
      position: relative;
      min-height: 100vh;
      overflow: hidden;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 50px 20px 180px;

      background:
        linear-gradient(
          to bottom,
          #7bd8f4 0%,
          #a9e8f7 58%,
          #c9f0a5 100%
        );
    }


    /* =========================
       太陽
    ========================= */

    .sun {
      position: absolute;

      top: 55px;
      right: 8%;

      width: 90px;
      height: 90px;

      background: #fff;
      border-radius: 50%;

      box-shadow:
        0 -28px 0 -24px #fff,
        0 28px 0 -24px #fff,
        28px 0 0 -24px #fff,
        -28px 0 0 -24px #fff,
        20px 20px 0 -24px #fff,
        -20px 20px 0 -24px #fff,
        20px -20px 0 -24px #fff,
        -20px -20px 0 -24px #fff;

      opacity: 0.95;
    }


    /* =========================
       雲
    ========================= */

    .cloud {
      position: absolute;

      width: 180px;
      height: 55px;

      background: rgba(255, 255, 255, 0.95);

      border-radius: 60px;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;

      background: rgba(255, 255, 255, 0.95);

      border-radius: 50%;
    }

    .cloud::before {
      width: 80px;
      height: 80px;

      left: 25px;
      bottom: 5px;
    }

    .cloud::after {
      width: 65px;
      height: 65px;

      right: 25px;
      bottom: 5px;
    }

    .cloud-1 {
      top: 110px;
      left: 5%;

      transform: scale(1.1);
    }

    .cloud-2 {
      top: 145px;
      right: 20%;

      transform: scale(0.65);
      opacity: 0.8;
    }

    .cloud-3 {
      top: 330px;
      left: -20px;

      transform: scale(0.65);
      opacity: 0.9;
    }


/* =========================
   タイトルエリア
========================= */

.title-area {
  position: relative;
  z-index: 5;
  text-align: center;
  max-width: 1100px;
}


/* 「ぽこあ」 */

.title-small {
  display: inline-block;

  margin-bottom: 5px;

  font-family:
    "M PLUS Rounded 1c", sans-serif;

  font-size: clamp(2.5rem, 7vw, 5rem);
  font-weight: 900;

  letter-spacing: 0.05em;

  color: #ff5b91;

  /* ぷっくりした白フチ */
  -webkit-text-stroke: 10px white;
  paint-order: stroke fill;

  /* やわらかい立体感 */
  text-shadow:
    0 5px 0 #c8e98c,
    0 8px 10px rgba(70, 150, 80, 0.18);

  transform: rotate(-2deg);
}


/* メインタイトル */

.title-main {
  margin: 0;

  font-family:
    "M PLUS Rounded 1c", sans-serif;

  font-size: clamp(2.8rem, 8vw, 7rem);

  /* とにかく太く */
  font-weight: 900;

  line-height: 1;

  letter-spacing: 0.01em;

  /* 丸文字っぽく見せるための白フチ */
  -webkit-text-stroke: 11px white;
  paint-order: stroke fill;

  /* ふわっとした立体感 */
  text-shadow:
    0 6px 0 #b8e87c,
    0 10px 12px rgba(70, 150, 80, 0.2);

  transform: rotate(-1deg);
}

.title-line {
  white-space: nowrap;
}

/* =========================
   文字ごとの色
========================= */

.title-main .blue {
  color: #35aee8;
}

.title-main .purple {
  color: #a866e8;
}

.title-main .orange {
  color: #f3943c;
}

.title-main .green {
  color: #79ce4c;
}

.title-main .pink {
  color: #ef6398;
}

.title-main .yellow {
  color: #f6c52a;
}

    /* =========================
       説明文
    ========================= */

    .description {
      margin: 35px auto 0;

      max-width: 650px;

      padding: 15px 25px;

      color: #47727d;

      font-size: 1.05rem;
      line-height: 1.9;

      background: rgba(255, 255, 255, 0.75);

      border-radius: 20px;

      box-shadow:
        0 5px 15px rgba(70, 160, 170, 0.12);
    }


    /* =========================
       ボタン
    ========================= */

    .buttons {
      position: relative;
      z-index: 10;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 20px;

      margin-top: 35px;
    }

    .button {
      display: flex;
      justify-content: center;
      align-items: center;

      min-width: 190px;
      min-height: 64px;

      padding: 12px 30px;

      border: 5px solid white;
      border-radius: 999px;

      font-size: 1.2rem;
      font-weight: 900;

      box-shadow:
        0 7px 0 rgba(90, 160, 90, 0.25);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-4px);

      box-shadow:
        0 11px 0 rgba(90, 160, 90, 0.22);
    }

    .button:active {
      transform: translateY(3px);

      box-shadow:
        0 4px 0 rgba(90, 160, 90, 0.22);
    }

    .button-use {
      background: #ff8eab;
      color: white;
    }

    .button-howto {
      background: #ffffff;
      color: #50a8d8;
    }


    /* =========================
       草原
    ========================= */

    .ground {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 170px;

      background:
        linear-gradient(
          to bottom,
          #b7e86e 0%,
          #a5dc61 55%,
          #91cf55 100%
        );

      border-top:
        8px solid rgba(255, 255, 255, 0.45);

      clip-path: polygon(
        0 12%,
        5% 10%,
        10% 14%,
        15% 8%,
        20% 13%,
        25% 7%,
        30% 13%,
        35% 9%,
        40% 14%,
        45% 8%,
        50% 13%,
        55% 7%,
        60% 12%,
        65% 8%,
        70% 14%,
        75% 9%,
        80% 13%,
        85% 7%,
        90% 13%,
        95% 9%,
        100% 12%,
        100% 100%,
        0 100%
      );
    }


    /* =========================
       草原の飾り
    ========================= */

    .grass {
      position: absolute;

      bottom: 125px;

      width: 0;
      height: 0;

      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 35px solid #8bcf55;

      opacity: 0.9;
    }

    .grass-1 {
      left: 5%;
    }

    .grass-2 {
      left: 12%;
      transform: scale(0.7);
    }

    .grass-3 {
      left: 22%;
      transform: scale(1.2);
    }

    .grass-4 {
      left: 35%;
      transform: scale(0.8);
    }

    .grass-5 {
      left: 48%;
      transform: scale(1.1);
    }

    .grass-6 {
      left: 62%;
      transform: scale(0.75);
    }

    .grass-7 {
      left: 75%;
      transform: scale(1.2);
    }

    .grass-8 {
      left: 88%;
      transform: scale(0.8);
    }


    /* =========================
       小さな花
    ========================= */

    .flower {
      position: absolute;

      bottom: 55px;

      width: 18px;
      height: 18px;

      background: #f8dd22;

      border-radius: 50%;

      box-shadow:
        0 -8px 0 -2px #f8dd22,
        0 8px 0 -2px #f8dd22,
        8px 0 0 -2px #f8dd22,
        -8px 0 0 -2px #f8dd22;
    }

    .flower-1 {
      left: 12%;
    }

    .flower-2 {
      left: 29%;
      bottom: 80px;
      transform: scale(0.8);
    }

    .flower-3 {
      right: 20%;
      bottom: 65px;
      transform: scale(1.2);
    }

    .flower-4 {
      right: 7%;
      bottom: 95px;
      transform: scale(0.65);
    }


    /* =========================
       フッター
    ========================= */

    footer {
      position: absolute;

      z-index: 20;

      bottom: 15px;

      width: 100%;

      text-align: center;

      color: rgba(70, 110, 70, 0.75);

      font-size: 0.8rem;
    }


    /* =========================
       スマートフォン
    ========================= */

    @media (max-width: 600px) {

      .top {
        padding:
          80px 18px 160px;
      }

      .sun {
        width: 60px;
        height: 60px;

        top: 35px;
        right: 7%;
      }

      .cloud-1 {
        left: -60px;
        top: 100px;
      }

      .cloud-2 {
        right: -80px;
      }

      .cloud-3 {
        top: 300px;
      }

      .title-small {
        -webkit-text-stroke: 5px white;
      }

      .title-main {
        -webkit-text-stroke: 6px white;
      }

      .description {
        margin-top: 25px;

        padding: 13px 18px;

        font-size: 0.9rem;
      }

      .buttons {
        flex-direction: column;

        gap: 14px;

        width: 100%;

        margin-top: 28px;
      }

      .button {
        width: min(320px, 90vw);

        min-height: 58px;

        font-size: 1.05rem;
      }

      .ground {
        height: 145px;
      }

      footer {
        bottom: 10px;

        font-size: 0.72rem;
      }
    }
  </style>
</head>

<body>

  <main class="top">

    <!-- 太陽 -->
    <div class="sun"></div>

    <!-- 雲 -->
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>


    <!-- メイン -->
    <section class="title-area">

      <div class="title-small">
        ぽこあ
      </div>

<h1 class="title-main">
  <span class="title-line">
    <span class="blue">ポ</span><span class="purple">ケ</span><span class="orange">モ</span><span class="green">ン</span><span class="pink">デ</span><span class="purple">ー</span><span class="yellow">タ</span>
  </span>
  <span class="title-line">
    <span class="blue">ず</span><span class="green">か</span><span class="pink">ん</span>

</h1>

      <div class="description">
        ポケモンをさまざまな条件から探せる<br>
        非公式のデータ検索ツールです。
      </div>


      <!-- ボタン -->
      <nav class="buttons" aria-label="メインメニュー">

        <a
          href="https://naru08-creator.github.io/naru-pokopia-zukan/"
          class="button button-use"

      </nav>

    </section>


    <!-- 草原 -->
    <div class="ground"></div>

    <!-- 草 -->
    <div class="grass grass-1"></div>

    <div class="grass grass-4"></div>
    <div class="grass grass-5"></div>

    <div class="flower flower-1"></div>
    <div class="flower flower-2"></div>

    <!-- フッター -->
<footer>
  <div class="footer-links">

</footer>

  </main>

</body>
</html>
